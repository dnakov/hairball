name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Run Swift tests
        run: swift test

      - name: Verify fixtures
        run: |
          ./scripts/export-fixtures.sh
          git diff --exit-code spec/fixtures

      - name: Build Apple demo
        run: ./scripts/build-apple-demo.sh

      - name: Run Android core tests
        run: ./android/gradlew -p android :hairball-core:test

      - name: Assemble Android libraries and demo
        run: ./android/gradlew -p android :hairball-compose:assembleDebug :hairball-demo:assembleDebug

      - name: Validate local Android publish
        run: ./scripts/android-publish-dry-run.sh
